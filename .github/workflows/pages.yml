name: Test and deploy TKM landing

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run landing tests
        run: python -m unittest tests.test_landing_commercial_flow -v
      - name: Build static artifact
        run: |
          mkdir -p public
          cp landing/index.html landing/robots.txt landing/sitemap.xml public/
          cp -R landing/assets public/assets
          rm -f public/assets/payment-qr.png
          test -s public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
