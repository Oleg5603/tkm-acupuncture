<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ТКМ — Акупунктурные точки</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#0d1a26;--bg2:#131c28;--bg3:#1e2d3d;--bg4:#243547;--accent:#2a5a8a;--green:#1a6b3a;--red:#8b2020;--text:#c8d8e8;--text2:#7a9bb5;--yellow:#f0a500}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:0;overflow-x:hidden}
/* Header */
.app-header{background:var(--bg2);border-bottom:1px solid #1e3a55;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header h6{margin:0;font-size:15px;color:#aad4f5;font-weight:600}
.hdr-btns{display:flex;gap:6px;flex-wrap:wrap}
/* Nav */
.nav-tabs{background:var(--bg2);border-bottom:1px solid #1e3a55;padding:0 10px}
.nav-tabs .nav-link{color:var(--text2);border:none;padding:8px 14px;font-size:13px}
.nav-tabs .nav-link.active{color:#aad4f5;background:var(--bg);border-bottom:2px solid #3a8aff}
/* Symptoms layout */
.symp-wrap{display:grid;grid-template-columns:200px 1fr;gap:0;height:calc(100vh - 320px);min-height:280px}
@media(max-width:767px){.symp-wrap{grid-template-columns:1fr;height:auto}}
.cat-panel{background:var(--bg2);overflow-y:auto;border-right:1px solid #1e3a55;padding:4px}
@media(max-width:767px){.cat-panel{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid #1e3a55;height:auto;padding:4px 4px 0}}
.cat-btn{display:block;width:100%;text-align:left;background:var(--bg3);border:none;color:var(--text2);padding:7px 10px;font-size:12px;border-radius:6px;margin-bottom:3px;cursor:pointer;white-space:nowrap}
@media(max-width:767px){.cat-btn{display:inline-block;width:auto;margin:0 3px 4px 0;flex-shrink:0}}
.cat-btn:hover{background:var(--accent)}
.cat-btn.active{background:#1a4a6a;color:#fff}
.cb-panel{overflow-y:auto;padding:8px;background:var(--bg)}
.cb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media(max-width:767px){.cb-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.cb-grid{grid-template-columns:1fr}}
.cb-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg2)}
.cb-item:hover{background:var(--bg3)}
.cb-item.checked{background:#112a1e;border:1px solid #2a6a3a;color:#6adf9a}
.cb-item input[type=checkbox]{accent-color:#3adf7a;width:16px;height:16px;flex-shrink:0}
/* Search bar */
.search-row{display:flex;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid #1e3a55;flex-wrap:wrap}
.search-row input{flex:1;min-width:120px;background:var(--bg3);border:1px solid #1e3a55;color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px}
.search-row input:focus{outline:none;border-color:var(--accent)}
/* Buttons */
.btn-tkm{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
.btn-tkm:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-dark{background:var(--bg3)}
.btn-sm-tkm{padding:5px 10px;font-size:11px}
/* Protocol panel */
.protocol-panel{background:var(--bg2);border-top:2px solid #1e3a55;position:sticky;bottom:0;z-index:90}
.protocol-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;gap:6px;flex-wrap:wrap}
.priority-text{font-size:12px;color:var(--text2);flex:1;min-width:0}
.protocol-body{max-height:260px;overflow-y:auto;padding:4px 10px;transition:max-height .3s}
.protocol-body.collapsed{max-height:0;overflow:hidden;padding:0 10px}
/* Cards */
.pt-card{background:var(--bg3);border-radius:10px;margin-bottom:8px;overflow:hidden}
.pt-card-head{background:var(--bg4);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pt-code{font-size:15px;font-weight:700}
.pt-type{font-size:11px;color:var(--yellow)}
.pt-name{font-size:12px;color:#aac4e0}
.pt-rule{font-size:11px;color:var(--text2);padding:4px 14px 2px}
.pt-desc{font-size:11px;color:#5a8aaa;font-style:italic;padding:0 14px 8px}
.action-ton{color:#2ecc71}
.action-sed{color:#e74c3c}
.action-obo{color:#f39c12}
/* Diagnoses */
.diag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px}
@media(max-width:767px){.diag-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.diag-grid{grid-template-columns:1fr}}
.diag-btn{background:var(--bg3);border:1px solid #1e3a55;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;text-align:left}
.diag-btn:hover{background:var(--accent);color:#fff}
/* Ryodoraku */
.ryo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px}
@media(min-width:768px){.ryo-grid{grid-template-columns:repeat(3,1fr)}}
.ryo-row{background:var(--bg2);border-radius:8px;padding:8px 10px}
.ryo-row label{font-size:11px;color:var(--text2);display:block;margin-bottom:4px}
.ryo-inputs{display:flex;gap:6px}
.ryo-inputs input{flex:1;background:var(--bg3);border:1px solid #1e3a55;color:var(--text);border-radius:5px;padding:5px;font-size:13px;text-align:center}
/* Tab content */
.tab-content{display:none}
.tab-content.active{display:block}
/* Toast */
.toast-msg{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a4a2a;color:#adffc0;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none}
</style>
</head>
<body>

<div class="app-header">
  <h6>🌿 ТКМ — Акупунктурные точки</h6>
  <div class="hdr-btns">
    <button class="btn-tkm btn-sm-tkm" onclick="downloadWord()">📄 Word</button>
    <button class="btn-tkm btn-sm-tkm btn-dark" onclick="showPrinciples()">📖 Принципы ТКМ</button>
  </div>
</div>

<!-- Tabs nav -->
<div style="background:var(--bg2);border-bottom:1px solid #1e3a55">
  <div style="display:flex;padding:0 10px">
    <button class="tab-nav active" data-tab="symptoms">🩺 Жалобы</button>
    <button class="tab-nav" data-tab="ryodoraku">📊 Риодораку</button>
    <button class="tab-nav" data-tab="diagnoses">🏥 Диагнозы</button>
  </div>
</div>
<style>
.tab-nav{background:none;border:none;color:var(--text2);padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
.tab-nav.active{color:#aad4f5;border-bottom:2px solid #3a8aff}
</style>

<!-- ═══ ЖАЛОБЫ ═══ -->
<div class="tab-content active" id="tab-symptoms">
  <div class="search-row">
    <input type="search" id="symptomSearch" placeholder="Поиск симптома..." oninput="filterSymptoms()">
    <button class="btn-tkm btn-sm-tkm btn-green" onclick="showAddCustom()">➕ Добавить свой</button>
    <button class="btn-tkm btn-sm-tkm btn-dark" onclick="clearAll()">✕ Снять все</button>
  </div>
  <div class="symp-wrap">
    <div class="cat-panel" id="catPanel"><!-- JS --></div>
    <div class="cb-panel">
      <div class="cb-grid" id="cbGrid"><!-- JS --></div>
    </div>
  </div>
  <div style="padding:6px 12px;font-size:12px;color:var(--text2)">
    Выбрано: <span id="selCount">0</span>
    &nbsp;&nbsp;
    <label style="cursor:pointer">
      <input type="checkbox" id="acuteChk" onchange="recompute()"> ⚡ Острая боль / Xi-точки
    </label>
  </div>
</div>

<!-- ═══ РИОДОРАКУ ═══ -->
<div class="tab-content" id="tab-ryodoraku">
  <div style="padding:10px 14px">
    <p style="font-size:12px;color:var(--text2)">Введите показатели (мкА) для каждого меридиана</p>
    <div class="ryo-grid" id="ryoGrid"><!-- JS --></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-tkm" onclick="analyzeRyo()">Анализировать</button>
      <button class="btn-tkm btn-dark" onclick="clearRyo()">Очистить</button>
    </div>
  </div>
</div>

<!-- ═══ ДИАГНОЗЫ ═══ -->
<div class="tab-content" id="tab-diagnoses">
  <div style="padding:8px 12px">
    <input type="search" placeholder="Найти диагноз..." oninput="filterDiag(this.value)"
           style="width:100%;background:var(--bg3);border:1px solid #1e3a55;color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px">
  </div>
  <div class="diag-grid" id="diagGrid"><!-- JS --></div>
</div>

<!-- ═══ ПРОТОКОЛ (sticky bottom) ═══ -->
<div class="protocol-panel" id="protocolPanel">
  <div class="protocol-hdr">
    <div class="priority-text" id="priorityText">Выберите симптомы или диагноз</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn-tkm btn-sm-tkm" onclick="downloadWord()">📄 Word</button>
      <button class="btn-tkm btn-sm-tkm btn-dark" onclick="showPrinciples()">📖 ТКМ</button>
      <button class="btn-tkm btn-sm-tkm btn-dark" onclick="toggleProtocol()" id="toggleBtn">▼ Скрыть</button>
    </div>
  </div>
  <div class="protocol-body" id="protocolBody">
    <p style="font-size:12px;color:var(--text2);text-align:center;padding:10px">Протокол появится здесь</p>
  </div>
</div>

<!-- Toast -->
<div class="toast-msg" id="toastMsg"></div>

<!-- Модальное окно принципов ТКМ -->
<div id="principlesModal" style="display:none;position:fixed;inset:0;background:#000a;z-index:200;overflow-y:auto">
  <div style="background:var(--bg2);margin:20px auto;max-width:700px;border-radius:12px;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h6 style="margin:0;color:#aad4f5">📖 Принципы ТКМ</h6>
      <button onclick="closePrinciples()" style="background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer">✕</button>
    </div>
    <pre id="principlesText" style="white-space:pre-wrap;font-family:'Segoe UI',sans-serif;font-size:13px;color:var(--text);line-height:1.6;max-height:70vh;overflow-y:auto"></pre>
  </div>
</div>

<!-- Модальное окно добавления симптома -->
<div id="addCustomModal" style="display:none;position:fixed;inset:0;background:#000a;z-index:200;overflow-y:auto">
  <div style="background:var(--bg2);margin:20px auto;max-width:420px;border-radius:12px;padding:20px">
    <h6 style="color:#aad4f5">➕ Добавить симптом</h6>
    <input id="customName" type="text" placeholder="Название симптома"
           style="width:100%;background:var(--bg3);border:1px solid #1e3a55;color:var(--text);border-radius:6px;padding:8px;font-size:13px;margin-bottom:10px">
    <p style="font-size:12px;color:var(--text2)">Связанные меридианы (вес 1–3):</p>
    <div id="merCheckboxes" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn-tkm btn-green" onclick="saveCustomSymptom()">Сохранить</button>
      <button class="btn-tkm btn-dark" onclick="document.getElementById('addCustomModal').style.display='none'">Отмена</button>
    </div>
  </div>
</div>

<script>
// ── Данные ──
let CATALOG = [];
let DIAGNOSES = [];
let allDiagnoses = [];
let selectedSymptoms = new Set();
let currentProtocol = [];
let currentScores = {};
let currentCategory = "";
let protocolVisible = true;
let lastSource = {type: null, symptoms: [], acute: false, ryo: {}, diagnosis: ""};

const RYO_MERIDIANS = [
  ["P","Лёгкие"],["GI","Толстый к-к"],["E","Желудок"],["RP","Селезёнка"],
  ["C","Сердце"],["IG","Тонкий к-к"],["V","Мочевой п-рь"],["R","Почки"],
  ["MC","Перикард"],["TR","Тройной об."],["VB","Жёлчный п-рь"],["F","Печень"]
];

const ACTION_CLASS = {
  "тонизация":"action-ton", "седация":"action-sed", "обезболивание":"action-obo"
};

// ── Init ──
async function init(){
  const [catResp, diagResp] = await Promise.all([
    fetch("/api/catalog"), fetch("/api/diagnoses")
  ]);
  CATALOG = await catResp.json();
  DIAGNOSES = await diagResp.json();
  allDiagnoses = [...DIAGNOSES];

  buildCategoryPanel();
  selectCategory("", "Все симптомы");
  buildDiagGrid(allDiagnoses);
  buildRyoGrid();
  buildMerCheckboxes();
}

// ── Category panel ──
function buildCategoryPanel(){
  const panel = document.getElementById("catPanel");
  panel.innerHTML = "";
  const all = document.createElement("button");
  all.className = "cat-btn active";
  all.textContent = "🔍 Все симптомы";
  all.onclick = () => selectCategory("", "Все симптомы");
  all.dataset.cat = "";
  panel.appendChild(all);
  CATALOG.forEach(cat => {
    const b = document.createElement("button");
    b.className = "cat-btn";
    b.textContent = `${cat.emoji} ${cat.name}`;
    b.dataset.cat = cat.name;
    b.onclick = () => selectCategory(cat.name, `${cat.emoji} ${cat.name}`);
    panel.appendChild(b);
  });
}

function selectCategory(name, label){
  currentCategory = name;
  document.querySelectorAll(".cat-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.cat === name));
  const syms = name === ""
    ? CATALOG.flatMap(c => c.symptoms)
    : (CATALOG.find(c => c.name === name)?.symptoms || []);
  renderCheckboxes(syms);
}

function filterSymptoms(){
  const q = document.getElementById("symptomSearch").value.toLowerCase().trim();
  if(!q){ selectCategory(currentCategory); return; }
  const all = CATALOG.flatMap(c => c.symptoms);
  renderCheckboxes(all.filter(s => s.toLowerCase().includes(q)));
}

function renderCheckboxes(symptoms){
  const grid = document.getElementById("cbGrid");
  grid.innerHTML = "";
  symptoms.forEach(name => {
    const checked = selectedSymptoms.has(name);
    const div = document.createElement("label");
    div.className = "cb-item" + (checked ? " checked" : "");
    div.innerHTML = `<input type="checkbox" ${checked?"checked":""} onchange="toggleSymptom('${escHtml(name)}',this)">
                     <span>${escHtml(name)}</span>`;
    grid.appendChild(div);
  });
}

function toggleSymptom(name, chk){
  if(chk.checked) selectedSymptoms.add(name);
  else selectedSymptoms.delete(name);
  chk.parentElement.classList.toggle("checked", chk.checked);
  document.getElementById("selCount").textContent = selectedSymptoms.size;
  recompute();
}

function clearAll(){
  selectedSymptoms.clear();
  document.getElementById("selCount").textContent = 0;
  document.getElementById("acuteChk").checked = false;
  renderCheckboxes(currentCategory === ""
    ? CATALOG.flatMap(c => c.symptoms)
    : (CATALOG.find(c => c.name === currentCategory)?.symptoms || []));
  clearProtocol();
}

// ── Analysis ──
async function recompute(){
  if(selectedSymptoms.size === 0){ clearProtocol(); return; }
  const acute = document.getElementById("acuteChk").checked;
  lastSource = {type:"symptoms", symptoms:[...selectedSymptoms], acute, ryo:{}, diagnosis:""};
  const resp = await fetch("/api/analyze",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({symptoms:[...selectedSymptoms], acute})
  });
  const data = await resp.json();
  showProtocol(data);
}

async function analyzeRyo(){
  const values = {};
  let hasVal = false;
  RYO_MERIDIANS.forEach(([code]) => {
    const l = parseFloat(document.getElementById(`ryo_${code}_l`)?.value?.replace(",","."));
    const r = parseFloat(document.getElementById(`ryo_${code}_r`)?.value?.replace(",","."));
    if(!isNaN(l) && !isNaN(r)){ values[code] = [l, r]; hasVal = true; }
  });
  if(!hasVal){ showToast("Введите показатели"); return; }
  lastSource = {type:"ryo", symptoms:[], acute:false, ryo:values, diagnosis:""};
  const resp = await fetch("/api/ryodoraku",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({values})
  });
  const data = await resp.json();
  showProtocol(data);
  switchTab("symptoms");
}

async function applyDiagnosis(name){
  lastSource = {type:"diagnosis", symptoms:[], acute:false, ryo:{}, diagnosis:name};
  const resp = await fetch(`/api/diagnosis/${encodeURIComponent(name)}`);
  const data = await resp.json();
  showProtocol(data, `Диагноз: ${name}`);
  switchTab("symptoms");
}

function showProtocol(data, titleOverride){
  currentProtocol = data.protocol || [];
  currentScores   = data.scores   || {};
  document.getElementById("priorityText").textContent = titleOverride || data.priority || "Нет данных";

  const body = document.getElementById("protocolBody");
  if(!currentProtocol.length){
    body.innerHTML = '<p style="font-size:12px;color:var(--text2);text-align:center;padding:10px">Нет точек</p>';
    return;
  }
  body.innerHTML = "";
  currentProtocol.forEach(p => {
    const acls = ACTION_CLASS[p.action] || "";
    const card = document.createElement("div");
    card.className = "pt-card";
    card.innerHTML = `
      <div class="pt-card-head">
        <span class="pt-code ${acls}">${p.point}</span>
        ${p.point_type?`<span class="pt-type">[${p.point_type}]`:`</span>`}
        <span class="pt-name">${p.name} (${p.code}) · ${p.action.toUpperCase()}</span>
      </div>
      <div class="pt-rule">${p.rule}</div>
      ${p.point_desc?`<div class="pt-desc">ℹ ${p.point_desc}</div>`:""}
    `;
    body.appendChild(card);
  });

  if(protocolVisible){
    body.classList.remove("collapsed");
    document.getElementById("toggleBtn").textContent = "▼ Скрыть";
  }
}

function clearProtocol(){
  currentProtocol = [];
  currentScores = {};
  document.getElementById("priorityText").textContent = "Выберите симптомы или диагноз";
  document.getElementById("protocolBody").innerHTML =
    '<p style="font-size:12px;color:var(--text2);text-align:center;padding:10px">Протокол появится здесь</p>';
}

function toggleProtocol(){
  protocolVisible = !protocolVisible;
  const body = document.getElementById("protocolBody");
  const btn  = document.getElementById("toggleBtn");
  body.classList.toggle("collapsed", !protocolVisible);
  btn.textContent = protocolVisible ? "▼ Скрыть" : "▲ Показать протокол";
}

// ── Diagnoses ──
function buildDiagGrid(names){
  const grid = document.getElementById("diagGrid");
  grid.innerHTML = "";
  [...names].sort().forEach(name => {
    const b = document.createElement("button");
    b.className = "diag-btn";
    b.textContent = name;
    b.onclick = () => applyDiagnosis(name);
    grid.appendChild(b);
  });
}

function filterDiag(q){
  buildDiagGrid(allDiagnoses.filter(n => n.toLowerCase().includes(q.toLowerCase())));
}

// ── Ryodoraku grid ──
function buildRyoGrid(){
  const grid = document.getElementById("ryoGrid");
  RYO_MERIDIANS.forEach(([code, name]) => {
    const div = document.createElement("div");
    div.className = "ryo-row";
    div.innerHTML = `<label>${name} (${code})</label>
      <div class="ryo-inputs">
        <input id="ryo_${code}_l" type="number" placeholder="Лево" step="0.1">
        <input id="ryo_${code}_r" type="number" placeholder="Право" step="0.1">
      </div>`;
    grid.appendChild(div);
  });
}

function clearRyo(){
  RYO_MERIDIANS.forEach(([code]) => {
    document.getElementById(`ryo_${code}_l`).value = "";
    document.getElementById(`ryo_${code}_r`).value = "";
  });
  clearProtocol();
}

// ── Word download ──
async function downloadWord(){
  if(!currentProtocol.length){ showToast("Сначала постройте протокол"); return; }
  showToast("Генерация Word...");
  const resp = await fetch("/api/word",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(lastSource)
  });
  const blob = await resp.blob();
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = "протокол_ТКМ.docx";
  a.click();
  URL.revokeObjectURL(url);
}

// ── Principles ──
async function showPrinciples(){
  if(!currentProtocol.length){ showToast("Сначала постройте протокол"); return; }
  const resp = await fetch("/api/analyze",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({symptoms:[...selectedSymptoms], acute:false})
  });
  const data = await resp.json();
  // Use last known scores
  const src = lastSource;
  let syms = src.symptoms || [];

  // Rebuild TCM text via word endpoint — we need a separate explain endpoint
  // For now use cached from last analysis
  document.getElementById("principlesText").textContent = "(загрузка...)";
  document.getElementById("principlesModal").style.display = "block";

  // Fetch explanation via a small trick: generate word and read text
  const resp2 = await fetch("/api/explain", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(lastSource)
  });
  if(resp2.ok){
    const d = await resp2.json();
    document.getElementById("principlesText").textContent = d.text;
  }
}

function closePrinciples(){
  document.getElementById("principlesModal").style.display = "none";
}

// ── Custom symptom ──
function buildMerCheckboxes(){
  const div = document.getElementById("merCheckboxes");
  RYO_MERIDIANS.forEach(([code, name]) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:6px;font-size:12px";
    row.innerHTML = `<input type="checkbox" id="mcb_${code}">
      <label for="mcb_${code}" style="flex:1">${code} ${name}</label>
      <select id="mw_${code}" style="background:var(--bg3);border:1px solid #1e3a55;color:var(--text);border-radius:4px;padding:2px">
        <option>1</option><option selected>2</option><option>3</option>
      </select>`;
    div.appendChild(row);
  });
}

function showAddCustom(){
  document.getElementById("customName").value = "";
  RYO_MERIDIANS.forEach(([code]) => {
    document.getElementById(`mcb_${code}`).checked = false;
  });
  document.getElementById("addCustomModal").style.display = "block";
}

async function saveCustomSymptom(){
  const name = document.getElementById("customName").value.trim();
  if(!name){ showToast("Введите название"); return; }
  const weights = {};
  RYO_MERIDIANS.forEach(([code]) => {
    if(document.getElementById(`mcb_${code}`).checked)
      weights[code] = parseInt(document.getElementById(`mw_${code}`).value);
  });
  await fetch("/api/custom",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name, weights})
  });
  document.getElementById("addCustomModal").style.display = "none";
  showToast(`"${name}" добавлен`);
  // Refresh catalog
  const resp = await fetch("/api/catalog");
  CATALOG = await resp.json();
  if(currentCategory === "") selectCategory("", "Все симптомы");
}

// ── Tab switching ──
function switchTab(id){
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-nav").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-"+id).classList.add("active");
  document.querySelector(`.tab-nav[data-tab="${id}"]`).classList.add("active");
}

document.querySelectorAll(".tab-nav").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

// ── Utils ──
function showToast(msg){
  const t = document.getElementById("toastMsg");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2500);
}

function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

init();
</script>
